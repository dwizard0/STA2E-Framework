<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STA2e Remote</title>
<style>
:root {
  --bg: #0d0f17;
  --panel: #161a26;
  --panel2: #1d2233;
  --line: #2c3349;
  --text: #e6e8ef;
  --muted: #9aa3b8;
  --orange: #f29c38;
  --lilac: #b69ae0;
  --blue: #6fa8ff;
  --cyan: #56d0e0;
  --green: #4cc38a;
  --gold: #f2c94c;
  --red: #ff6b6b;
  --sel: #4cc38a;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 13px; }
button, select, input, textarea { font: inherit; color: inherit; }
a { color: var(--blue); }

/* ---------- header ---------- */
.top { display: flex; align-items: stretch; gap: 8px; padding: 8px 10px 0 10px; }
.brand { display: flex; align-items: center; gap: 8px; background: var(--orange); color: #1a1206;
  border-radius: 18px 4px 4px 18px; padding: 6px 14px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
.pools { display: flex; gap: 8px; margin-left: auto; align-items: center; }
.pool { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 20px; padding: 4px 10px; }
.pool .lbl { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .6px; }
.pool .val { font-weight: 700; font-size: 16px; min-width: 18px; text-align: center; }
.pool.mom .val { color: var(--cyan); }
.pool.thr .val { color: var(--red); }
.pips { display: inline-flex; gap: 3px; }
.pip { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--cyan); background: transparent; padding: 0; }
.pip.on { background: var(--cyan); }
.pip.red { border-color: var(--red); } .pip.red.on { background: var(--red); }
.pip.gold { border-color: var(--gold); } .pip.gold.on { background: var(--gold); }
.iconbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }
.iconbtn:hover { border-color: var(--blue); }

.tabs { display: flex; gap: 4px; padding: 8px 10px 0 10px; border-bottom: 2px solid var(--line); flex-wrap: wrap; }
.tab { background: var(--panel); border: 1px solid var(--line); border-bottom: none; color: var(--muted);
  padding: 7px 14px; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: 600; }
.tab:hover { color: var(--text); }
.tab.active { background: var(--lilac); color: #140f1f; border-color: var(--lilac); }

main { padding: 10px; }
.notice { background: #2a2113; border: 1px solid #6b4c1c; color: #ffd9a3; border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
.notice.info { background: #13202e; border-color: #2c4a6b; color: #cfe4ff; }
.notice.bad { background: #2e1417; border-color: #6b2c33; color: #ffc9ce; }
.muted { color: var(--muted); }
.small { font-size: 11px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.tight { gap: 4px; }
.spacer { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.grid6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; margin-bottom: 10px; }
.card h3 { margin: 0 0 8px 0; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--orange); display: flex; align-items: center; gap: 8px; }
.card h3 .sub { color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 400; }

label.field { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
select, input[type=text], input[type=number], textarea {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; color: var(--text); }
input[type=number] { width: 64px; }
textarea { width: 100%; resize: vertical; }
input[type=checkbox] { accent-color: var(--green); }

.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 18px; padding: 6px 14px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--blue); }
.btn.primary { background: var(--orange); color: #1a1206; border-color: var(--orange); }
.btn.go { background: var(--green); color: #07170f; border-color: var(--green); }
.btn.warn { background: #3a1d20; border-color: var(--red); color: #ffd3d3; }
.btn.small { padding: 3px 10px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.big { font-size: 16px; padding: 10px 26px; }

/* ---------- tiles (attributes / departments) ---------- */
.tile { background: var(--panel2); border: 2px solid var(--line); border-radius: 8px; padding: 6px 4px; text-align: center; cursor: pointer; user-select: none; }
.tile .n { font-size: 11px; color: var(--muted); }
.tile .v { font-size: 20px; font-weight: 700; }
.tile:hover { border-color: var(--blue); }
.tile.sel { border-color: var(--sel); box-shadow: 0 0 0 2px rgba(76, 195, 138, .35) inset; background: #15261f; }
.tile.sel .n { color: #bff0d6; }
.tile.dead { opacity: .45; text-decoration: line-through; }
.tile.ro { cursor: default; }

.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.stepper button { background: var(--panel2); border: none; width: 26px; height: 26px; cursor: pointer; }
.stepper button:hover { background: var(--line); }
.stepper .sv { min-width: 30px; text-align: center; font-weight: 700; }

.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 3px 9px; margin: 2px; }
.chip.on { border-color: var(--sel); background: #15261f; }
.chip button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0 2px; }
.chip.clickable { cursor: pointer; }

.buyslot { width: 92px; text-align: center; padding: 6px 4px; border-radius: 8px; border: 2px dashed var(--line); cursor: pointer; background: var(--panel2); }
.buyslot.mom { border-style: solid; border-color: var(--cyan); }
.buyslot.thr { border-style: solid; border-color: var(--red); }
.buyslot.locked { opacity: .35; cursor: not-allowed; }

/* ---------- dice ---------- */
.dice { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.die { width: 46px; height: 46px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 2px solid var(--line); background: var(--panel2); cursor: pointer; position: relative; }
.die .dv { font-size: 18px; font-weight: 800; line-height: 1; }
.die .dt { font-size: 9px; color: var(--muted); }
.die.s1 { border-color: var(--green); }
.die.s2 { border-color: var(--gold); background: #2a2410; }
.die.comp { box-shadow: 0 0 0 2px var(--red); }
.die.pick { outline: 3px solid var(--blue); outline-offset: 2px; }
.die.helper { width: 40px; height: 40px; }
.dgroup { display: flex; flex-direction: column; gap: 4px; }
.dgroup .gl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

.verdict { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
.verdict.ok { color: var(--green); } .verdict.bad { color: var(--red); }
.bigstat { display: flex; flex-direction: column; align-items: center; background: var(--panel2); border-radius: 8px; padding: 6px 12px; min-width: 76px; }
.bigstat .k { font-size: 10px; color: var(--muted); text-transform: uppercase; }
.bigstat .x { font-size: 22px; font-weight: 800; }

/* ---------- actions ---------- */
.subtabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.subtab { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px 11px; cursor: pointer; color: var(--muted); }
.subtab.active { background: var(--blue); border-color: var(--blue); color: #08142a; font-weight: 700; }
.action { border-left: 4px solid var(--lilac); background: var(--panel); border-radius: 0 8px 8px 0; padding: 8px 10px; margin-bottom: 8px; }
.action.minor { border-left-color: var(--cyan); }
.action.reaction { border-left-color: var(--red); }
.action.free { border-left-color: var(--muted); }
.action .an { font-weight: 700; font-size: 14px; }
.action .meta { color: var(--muted); font-size: 11px; margin: 2px 0 4px 0; }
.badge { display: inline-block; font-size: 10px; border-radius: 10px; padding: 1px 7px; background: var(--line); color: var(--text); margin-right: 4px; text-transform: uppercase; letter-spacing: .4px; }
.badge.maj { background: #3b2d55; } .badge.min { background: #16404a; } .badge.rx { background: #4a1f25; }

/* ---------- tracks ---------- */
.track { display: flex; flex-wrap: wrap; gap: 3px; }
.box { width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--orange); background: transparent; cursor: pointer; padding: 0; }
.box.on { background: var(--orange); }
.bar { position: relative; height: 22px; background: var(--panel2); border-radius: 11px; overflow: hidden; border: 1px solid var(--line); }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #2f7dd1, var(--cyan)); }
.bar .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--gold); }
.bar .mark.q { background: var(--red); }
.bar .bt { position: absolute; width: 100%; text-align: center; font-weight: 700; line-height: 20px; text-shadow: 0 1px 2px #000; }

table.t { width: 100%; border-collapse: collapse; }
table.t th, table.t td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; }

.toast { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: #2e1417; border: 1px solid var(--red);
  color: #ffd3d3; padding: 8px 14px; border-radius: 8px; max-width: 90%; z-index: 20; }
.toast.ok { background: #13261d; border-color: var(--green); color: #d3ffe6; }
.portrait { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--line); background: var(--panel2); }
.who { display: flex; align-items: center; gap: 8px; }
.who .nm { font-weight: 700; font-size: 15px; }
.mocklog { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 11px; color: var(--muted); }
.mocklog .msg { background: #f4f4f4; color: #000; border-radius: 6px; padding: 6px; margin: 4px 0; }
.xtrack { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0; }
.xbox { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--blue); }
.xbox.on { background: var(--blue); }
.xbox.trouble { border-color: var(--red); } .xbox.trouble.on { background: var(--red); }
.xbox.bt { border-width: 2px; border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.card.dim { opacity: .6; }
hr.sep { border: none; border-top: 1px solid var(--line); margin: 10px 0; }

/* importer */
.importer .preview { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
.importer textarea { margin: 6px 0; font-family: monospace; font-size: 11px; }
.importer input[type=file] { color: var(--muted); }
.kv { display: flex; gap: 8px; padding: 2px 0; font-size: 12px; }
.kv .k { flex: 0 0 90px; color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: .05em; padding-top: 2px; }
.btn.small.on { outline: 2px solid var(--orange); }
.pre { white-space: pre-wrap; }

/* STA2e Remote window: extra pieces on top of the STA 2E styles */
.spacer { flex: 1; }
.pill { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; border-radius: 12px;
  padding: 3px 10px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
.pill.on { color: #0d1a12; background: var(--green); border-color: var(--green); }
.pill.bad { color: #1a0d0d; background: var(--red); border-color: var(--red); }
.pill.busy { color: #1a1206; background: var(--gold); border-color: var(--gold); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #3a4258; display: inline-block; }
.dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip.missing { opacity: .6; font-style: italic; }
.field.wide { display: flex; flex-direction: column; gap: 3px; width: 100%; margin-top: 6px; }
.field.wide input { width: 100%; }
input.join { font-family: monospace; font-size: 11px; color: var(--cyan); }
.logline { padding: 2px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.card.conn { border-left: 3px solid var(--blue); }
.card.requests { border: 2px solid var(--gold); }
.chip.on { background: var(--green); color: #0d1a12; }

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---- rules.js ---- */
/*
 * STA 2E rules engine — pure functions, no DOM, no MapTool.
 * Source: Star Trek Adventures 2nd Edition Core Rulebook (ch. 5, 7, 8).
 * Written in ES2017 so it runs in MapTool's JavaFX WebView and in Node for tests.
 */
(function (root) {
  "use strict";

  var ATTRIBUTES = ["Control", "Daring", "Fitness", "Insight", "Presence", "Reason"];
  var DEPARTMENTS = ["Command", "Conn", "Engineering", "Medicine", "Science", "Security"];
  var SYSTEMS = ["Communications", "Computers", "Engines", "Sensors", "Structure", "Weapons"];

  var MOMENTUM_CAP = 6;          // p.261 group pool max
  var MAX_DICE = 5;              // p.257
  var DETERMINATION_MAX = 3;     // p.261
  var COMPLICATION_BUYOFF = 2;   // p.258 / p.264: 2 Threat per complication
  var THREAT_PER_PC = 2;         // p.264

  var CREW_QUALITY = {           // p.296 NPC vessel crew
    Basic: { attr: 8, dept: 1 },
    Proficient: { attr: 9, dept: 2 },
    Talented: { attr: 10, dept: 3 },
    Exceptional: { attr: 11, dept: 4 }
  };

  function int(v, d) {
    var n = parseInt(v, 10);
    return isNaN(n) ? (d === undefined ? 0 : d) : n;
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  /* ---------------- Dice pool ---------------- */

  // Cost of the n-th purchased die (1-based): 1, 2, 3 (p.255, p.260)
  function dieCost(n) { return n; }
  // Total cost for buying `count` extra dice, given `free` bonus dice already in the pool.
  // Bonus dice from talents still count toward the 3 purchasable dice (p.255 "Talents").
  function purchaseCost(count) {
    var total = 0;
    for (var i = 1; i <= count; i++) total += dieCost(i);
    return total;
  }
  function maxPurchasable(baseDice, bonusDice) {
    return clamp(MAX_DICE - baseDice - bonusDice, 0, 3);
  }

  // Complication range 1..5 => complication on 20, 19-20, ... 16-20 (p.258)
  function complicationFloor(range) { return 21 - clamp(int(range, 1), 1, 5); }

  // Evaluate one d20.
  //  tn: target number, critMax: highest value that is a critical (department if focus, else 1)
  function evalDie(value, tn, critMax, compRange) {
    var v = int(value);
    var succ = 0, crit = false;
    if (v <= tn) {
      succ = 1;
      if (v <= Math.max(1, critMax)) { succ = 2; crit = true; }
    }
    var comp = v >= complicationFloor(compRange);
    return { value: v, successes: succ, crit: crit, comp: comp };
  }

  function critMaxFor(dept, focus) { return focus ? Math.max(1, int(dept)) : 1; }

  /*
   * Evaluate a whole task.
   * spec = {
   *   difficulty, compRange,
   *   leader: { tn, critMax, dice:[values] },
   *   assists: [ { name, tn, critMax, dice:[value], compRange? } ],   // already rolled
   *   ship:   { tn, critMax, dice:[value], rerouted:bool } | null,
   *   bonusMomentum
   * }
   */
  function evaluateTask(spec) {
    var compRange = int(spec.compRange, 1);
    var leader = spec.leader;
    var leaderDice = leader.dice.map(function (v) { return evalDie(v, leader.tn, leader.critMax, compRange); });
    var leaderSucc = sum(leaderDice, "successes");

    var assistGroups = (spec.assists || []).map(function (a) {
      var dice = a.dice.map(function (v) { return evalDie(v, a.tn, a.critMax, compRange); });
      return { name: a.name, dice: dice, successes: sum(dice, "successes"), complications: count(dice, "comp") };
    });
    var shipGroup = null;
    if (spec.ship) {
      var sd = spec.ship.dice.map(function (v) { return evalDie(v, spec.ship.tn, spec.ship.critMax, compRange); });
      shipGroup = { name: spec.ship.name || "Ship", dice: sd, successes: sum(sd, "successes"), complications: count(sd, "comp"), rerouted: !!spec.ship.rerouted };
    }

    // p.256: assistants' successes only count if the leader scores at least 1
    var helpersCount = leaderSucc >= 1;
    var assistSucc = 0;
    assistGroups.forEach(function (g) { assistSucc += g.successes; });
    if (shipGroup) assistSucc += shipGroup.successes;

    var total = leaderSucc + (helpersCount ? assistSucc : 0) + int(spec.bonusSuccesses);
    var complications = count(leaderDice, "comp");
    assistGroups.forEach(function (g) { complications += g.complications; });
    if (shipGroup) complications += shipGroup.complications;
    // p.185: with Reserve Power rerouted to the assisting system, the ship's die counts as a 1 and
    // "each complication rolled counts as two complications" (every die on the task, not just the ship's).
    if (shipGroup && shipGroup.rerouted) complications *= 2;

    var difficulty = Math.max(0, int(spec.difficulty));
    var success = total >= difficulty;
    var momentum = success ? total - difficulty : 0;

    return {
      leaderDice: leaderDice,
      leaderSuccesses: leaderSucc,
      assists: assistGroups,
      ship: shipGroup,
      helpersCount: helpersCount,
      assistSuccesses: assistSucc,
      successes: total,
      difficulty: difficulty,
      success: success,
      momentum: momentum,
      bonusMomentum: int(spec.bonusMomentum),
      complications: complications,
      crits: count(leaderDice, "crit")
    };
  }

  // Opposed task (p.256): reactive side rolls first; its successes become the Difficulty.
  // External factors against the reactive character reduce that Difficulty (min 0).
  function opposedDifficulty(reactiveSuccesses, factorsAgainstReactive, factorsForActive) {
    return Math.max(0, int(reactiveSuccesses) - int(factorsAgainstReactive) + int(factorsForActive));
  }
  // If the active side fails, the reactive side gains 1 Momentum per success short.
  function opposedReactiveMomentum(difficulty, activeSuccesses) {
    return Math.max(0, int(difficulty) - int(activeSuccesses));
  }

  // Momentum left after a task goes to the group pool (cap 6). Bonus Momentum can never be saved.
  function bankMomentum(pool, leftover) {
    var p = int(pool), l = Math.max(0, int(leftover));
    var room = Math.max(0, MOMENTUM_CAP - p);
    var added = Math.min(room, l);
    return { pool: p + added, added: added, lost: l - added };
  }

  /* ---------------- Characters: Stress, Injuries ---------------- */

  function stressMax(ch) {
    var fitness = int(ch.Fitness, 7);
    var bonus = int(ch.StressBonus);
    var kind = ch.Kind || "Main";
    var values = Array.isArray(ch.Values) ? ch.Values.length : 0;
    if (kind === "Main") return Math.max(0, fitness + bonus);
    if (kind === "Supporting") {
      if (values >= 2) return Math.max(0, fitness + bonus);          // p.278
      if (values === 1) return Math.max(0, Math.ceil(fitness / 2) + bonus);
      return 0;
    }
    return 0; // NPCs do not have Stress (p.278)
  }

  // Suffer stress (p.277). Returns new stress, overflow complication flag.
  function sufferStress(current, amount, max) {
    var c = int(current), a = Math.max(0, int(amount));
    if (c + a > max) return { stress: max, taken: max - c, complication: true, fatigued: max > 0 };
    return { stress: c + a, taken: a, complication: false, fatigued: max > 0 && c + a >= max };
  }

  function recoverStress(current, amount) {
    return Math.max(0, int(current) - Math.max(0, int(amount)));
  }

  var REST = { breather: 4, "break": 8, sleep: 999 };

  // Injury severity after Protection (p.292), min 1. Piercing ignores Protection.
  function injurySeverity(baseSeverity, protection, piercing) {
    var s = int(baseSeverity, 1);
    if (!piercing) s -= int(protection);
    return Math.max(1, s);
  }

  // Can this character Avoid Injury by taking Stress? (p.292)
  function canAvoidInjury(ch, severity) {
    var kind = ch.Kind || "Main";
    if (kind === "Minor NPC") return { ok: false, reason: "Minor NPCs are Defeated by any successful attack." };
    if (kind === "Notable NPC") return { ok: true, threat: severity, reason: "Spend " + severity + " Threat (once per scene)." };
    if (kind === "Major NPC") return { ok: true, threat: severity, reason: "Spend " + severity + " Threat." };
    var max = stressMax(ch);
    if (max <= 0) return { ok: false, reason: "No Stress track." };
    var cur = int(ch.Stress);
    if (cur >= max) return { ok: false, reason: "Fatigued: cannot suffer more Stress." };
    if (cur + severity > max) return { ok: true, stress: severity, complication: true, reason: "Fills the Stress track and causes a complication." };
    return { ok: true, stress: severity, reason: "Take " + severity + " Stress." };
  }

  function isDying(ch) {
    if (!int(ch.Defeated)) return false;
    var inj = Array.isArray(ch.Injuries) ? ch.Injuries : [];
    return inj.some(function (i) { return i.kind === "deadly"; });
  }

  // Medical treatment Difficulty (p.292): severity, +1 (and +1 comp range) if the injury wasn't treated.
  function treatmentDifficulty(injury) {
    return int(injury.severity, 1) + (injury.treated ? 0 : 1);
  }

  /* ---------------- Starships ---------------- */

  function ratingBonus(rating) { // p.185 & p.226 share the same table
    var r = int(rating);
    if (r >= 13) return 4;
    if (r >= 11) return 3;
    if (r >= 9) return 2;
    if (r >= 7) return 1;
    return 0;
  }
  function resistance(ship) {
    return Math.ceil(int(ship.Scale, 1) / 2) + ratingBonus(ship.Structure) + int(ship.ResistanceBonus);
  }
  function shieldsMax(ship) {
    if (int(ship.ShieldsRaised, 1) === 0) return 0;
    return int(ship.Structure) + int(ship.Scale) + int(ship.Security) + int(ship.ShieldsBonus);
  }
  function breakthroughPoints(max) {

      var idx = (Array.isArray(cmd.dice) ? cmd.dice : []).map(function (i) { return num(i, -1); })
        .filter(function (i, k, arr) { return i >= 0 && i < res.dice.length && arr.indexOf(i) === k; });
      if (!idx.length) throw new Error("Pick the dice to re-roll first.");
      var det = cmd.source === "determination";
      if (det && (t.p.Kind !== "Main" || t.p.Determination < 1)) throw new Error("No Determination left.");
      return A.rollDice(idx.length).then(function (vals) {
        idx.forEach(function (i, k) { res.dice[i] = num(vals[k], 20); });
        evalOpen(res);
        var jobs = [];
        if (det) jobs.push(A.saveToken(t, { Determination: t.p.Determination - 1 }));
        return Promise.all(jobs).then(function () {
          logLine(connName(cid) + ": " + res.name + " re-rolled " + idx.length + " d20" + (det ? " (Determination)" : ""));
          return done([det ? "re-roll: Moment of Inspiration (1 Determination)" : "free re-roll",
            A.diceHtml(res.ev.leaderDice, res.name) + " &middot; <b>" + res.ev.successes + " vs " + res.difficulty + ": " + (res.success ? "SUCCESS" : "FAILURE") + "</b>"], "#6fa8ff");
        });
      });
    }

    if (act === "avoid") {
      var i = num(cmd.index, -1);
      if (res.comps[i] !== "open") throw new Error("That complication isn't open.");
      res.comps[i] = "bought";
      return A.addPools(0, R.COMPLICATION_BUYOFF).then(function () {
        return done(["complication avoided", "Adds " + R.COMPLICATION_BUYOFF + " Threat to avoid a complication."], "#ff9b9b");
      });
    }

    if (act === "sac") {
      if (res.success || res.sac) throw new Error("Succeed at Cost is only for a failed task.");
      res.sac = true;
      evalOpen(res);
      return done(["succeeds at cost", "The task succeeds with one extra complication. No Momentum."], "#ff9b9b");
    }

    if (act === "spend") {
      if (!res.success || res.sac) throw new Error("Momentum can only be spent on a success.");
      var sp = SPENDS.filter(function (x) { return x.key === cmd.key; })[0];
      if (!sp) throw new Error("Unknown Momentum spend.");
      var target = null;
      if (sp.key === "stress") {
        if ((res.stressFixed || 0) >= sp.max) throw new Error("At most " + sp.max + " Stress can be recovered from one task.");
        target = A.tok(String(cmd.target || ""));
        if (!target || !allies().some(function (a) { return a.id === target.id; })) throw new Error("Pick who recovers the Stress.");
        if (target.p.Stress < 1) throw new Error(target.name + " has no Stress to recover.");
      }
      var left = 0, fromBonus = 0, fromRoll = 0;
      return A.refreshPools().then(function () {
        if (res.bonusLeft + res.rollLeft + S.lib.Momentum < sp.cost) throw new Error("Not enough Momentum for " + sp.label + ".");
        fromBonus = Math.min(res.bonusLeft, sp.cost); fromRoll = Math.min(res.rollLeft, sp.cost - fromBonus); left = sp.cost - fromBonus - fromRoll;
        // Take any shortfall from the group pool first; only record the spend once it has been paid.
        return left > 0 ? A.addPools(-left, 0, true) : null;
      }).then(function () {
        res.bonusLeft -= fromBonus; res.rollLeft -= fromRoll;
        var what = sp.label + (target ? " (" + target.name + ")" : "");
        res.spentLog.push(what + " (" + sp.cost + ")");
        var jobs = [];
        if (target) {
          res.stressFixed = (res.stressFixed || 0) + 1;
          jobs.push(A.saveToken(target, { Stress: R.recoverStress(target.p.Stress, 1) }));
        }
        return Promise.all(jobs).then(function () {
          logLine(connName(cid) + ": " + res.name + " spent " + sp.cost + " Momentum: " + what);
          return done(["Momentum spend", esc(what) + ": " + sp.cost + " Momentum" + (left > 0 ? " (" + left + " from the group pool)" : "")]);
        });
      });
    }
    throw new Error("Unknown roll action.");
  }

  function runStress(cid, cmd) {
    var t = charFor(cid, cmd), p = t.p;
    var mx = R.stressMax(p);
    if (mx <= 0) throw new Error(t.name + " doesn't track Stress.");
    var delta = R.clamp(num(cmd.delta, 0), -mx, mx);
    if (!delta) throw new Error("Nothing to change.");
    var next = R.clamp(p.Stress + delta, 0, mx);
    var ch = { Stress: next };
    if (next < mx) ch.FatiguedAttribute = "";
    return A.saveToken(t, ch).then(function () {
      var line = t.name + (delta > 0 ? " takes " + delta : " recovers " + (-delta)) + " Stress (" + next + " / " + mx + ")" + (next >= mx ? ": Fatigued" : "") + ".";
      logLine(connName(cid) + ": " + line);
      return A.chat(A.card(t.name, "Stress", [esc(line)], "#b69ae0")).then(function () { return { stress: next, stressMax: mx }; });
    });
  }

  function runDetermination(cid, cmd) {
    var t = charFor(cid, cmd), p = t.p;
    if (p.Kind !== "Main") throw new Error("Only main characters have Determination.");
    if (p.Determination < 1) throw new Error("No Determination left.");
    var why = String(cmd.reason || "").slice(0, 80);
    var next = p.Determination - 1;
    return A.saveToken(t, { Determination: next }).then(function () {
      var line = t.name + " spends 1 Determination" + (why ? ": " + why : "") + " (" + next + " left).";
      logLine(connName(cid) + ": " + line);
      return A.chat(A.card(t.name, "Determination", [esc(line)], "#f2c94c")).then(function () { return { determination: next }; });
    });
  }

  function runChat(cid, cmd) {
    var text = String(cmd.text || "").trim().slice(0, 400);
    if (!text) throw new Error("Nothing to say.");
    var who = connName(cid);
    if (cmd.tokenId) who = charFor(cid, cmd).name;
    return A.chat(A.card(who, "remote", [esc(text).replace(/\n/g, "<br>")], "#6fa8ff")).then(function () {
      logLine(connName(cid) + " said: " + text.slice(0, 60));
      return { said: true };
    });
  }

  var RUNNERS = { roll: runRoll, rollAction: runRollAction, stress: runStress, determination: runDetermination, chat: runChat };
  A.remoteRunners = RUNNERS;

  function runOne(c) {
    var cmd = c.cmd || {};
    var fn = RUNNERS[cmd.type];
    var p;
    try {
      if (!X.assign[c.cid]) throw new Error("This connection has no characters assigned.");
      if (!fn) throw new Error("Unknown command.");
      p = Promise.resolve(fn(c.cid, cmd));
    } catch (e) { p = Promise.reject(e); }
    return p.then(function (result) { X.results.push({ id: c.id, ok: true, result: result }); },
      function (e) {
        var msg = String(e && e.message || e);
        logLine(connName(c.cid) + ": refused " + (cmd.type || "command") + " (" + msg + ")");
        X.results.push({ id: c.id, ok: false, error: msg });
      });
  }
  function runAll(cmds) {
    // Fresh token data and pools first, then one command at a time so Momentum stays consistent.
    return A.loadAll().then(function () {
      if (S.error) throw new Error(S.error);
      return cmds.reduce(function (pr, c) {
        return pr.then(function () { return A.refreshPools(); }).then(function () { return runOne(c); });
      }, Promise.resolve());
    }).then(function () { return A.loadAll(); });
  }

  /* ---------------- the sync loop ---------------- */
  var timer = null, inFlight = false;
  function schedule(ms) { clearTimeout(timer); if (X.cfg.linkOn) timer = setTimeout(tick, ms); }

  function tick() {
    if (inFlight || !X.cfg.linkOn || !X.cfg.campaign) return;
    inFlight = true;
    var needSnap = Date.now() - X.lastSnapAt > SNAPSHOT_EVERY_MS;
    var prep = needSnap ? A.loadAll().then(function () { X.lastSnapAt = Date.now(); return closeStaleRolls(); }) : Promise.resolve();
    var results = [], snaps = null;
    prep.then(function () {
      results = X.results.splice(0, X.results.length);
      snaps = changedSnapshots(false);
      return relay({ action: "gm.sync", campaign: X.cfg.campaign, gmKey: X.cfg.gmKey, results: results, snapshots: snaps || {} });
    }).then(function (res) {
      X.conns = res.connections || [];
      X.serverNow = res.now || 0;
      X.campaignName = res.name || "";
      noticeRequests(res.requests || []);
      X.status = "ok"; X.statusText = ""; X.lastSync = Date.now();
      var cmds = res.commands || [];
      if (!cmds.length) return false;
      X.status = "busy"; render();
      return runAll(cmds).then(function () { return true; });
    }).then(function (ran) {
      inFlight = false;
      render();
      schedule(ran ? 50 : POLL_MS); // send results straight back
    }).catch(function (e) {
      // Put unsent results back so they go next time; snapshots are resent in full.
      X.results = results.concat(X.results);
      X.sentSnaps = {};
      inFlight = false;
      X.status = "error"; X.statusText = String(e && e.message || e);
      render();
      if (e && (e.code === "badKey" || e.code === "unknownCampaign" || e.code === "externalAccessOff" || e.code === "gmOnly")) {
        X.cfg.linkOn = false; saveConfig().catch(function () {});
        return;
      }
      schedule(POLL_MS * 3);
    });
  }
  function closeStaleRolls() {
    var stale = Object.keys(X.open).filter(function (cid) { return Date.now() - (X.open[cid].at || 0) > OPEN_ROLL_MS; });
    return stale.reduce(function (pr, cid) {
      return pr.then(function () { return finishOpen(cid, "closed automatically: no one pressed Done for 15 minutes"); });
    }, Promise.resolve());
  }
  function setLink(on) {
    X.cfg.linkOn = on;
    X.sentSnaps = {};
    X.status = on ? "busy" : "off"; X.statusText = "";
    return saveConfig().then(function () { render(); if (on) { X.lastSnapAt = 0; schedule(10); } else clearTimeout(timer); });
  }

  /* ---------------- join requests from the lobby ---------------- */
  function noticeRequests(list) {
    X.requests = list;
    list.forEach(function (r) {
      if (X.seenRequests[r.id]) return;
      X.seenRequests[r.id] = 1;
      var cname = connName(r.conn);
      logLine(r.name + " asks to join as " + cname);
      // The link window may be behind MapTool; a GM-only chat line makes sure the request is seen.
      A.chat(A.card("STA2e Remote", "join request", [esc(r.name) + " wants to play as <b>" + esc(cname) + "</b>. Approve or deny it in the STA2e Remote window (/staremote)."], "#6fa8ff"), "gm").catch(function () {});
    });
  }
  function answerRequest(r, approve) {

      X.requests = X.requests.filter(function (x) { return x.id !== r.id; });

  function setPin(c, pin) {

    }).catch(function (e) { A.toast(String(e.message || e)); });

  function lobbyUrl() { return (X.cfg.server || "").replace(/api\.php(\?.*)?$/, ""); }

  /* ---------------- GM actions ---------------- */
  function setupServer() {
    var st = X.setup;

  function forgetServer() {

    X.cfg = { server: "", campaign: "", gmKey: "", linkOn: false };

  }
  function newConnection() {

    relay({ action: "gm.connect", campaign: X.cfg.campaign, gmKey: X.cfg.gmKey, name: name }).then(function (res) {
      X.assign[res.id] = { tokens: [], join: res.join };

  }
  function removeConnection(c) {

  function assignToken(cid, tokenId) {

  }

  /* ---------------- window ---------------- */
  function ago(ms) {
    if (!ms) return "never";

    if (s < 5) return "just now";

    if (s < 3600) return Math.round(s / 60) + " min ago";
    return Math.round(s / 3600) + " h ago";
  }

        h("b", null, "Link on")),

      } }, X.confirmForget ? "Really forget? Players' links stop working" : "Forget server")));

      } }, X.confirmRemove === c.id ? "Really remove?" : "Remove")));

      })), function (v) { if (v) assignToken(c.id, v); })));

    card.appendChild(h("div", { class: "row" }, h("span", { class: "muted small" }, "PIN"),
      h("span", { class: "chip" + (c.hasPin ? " on" : "") }, c.hasPin ? "set" : "none"), pinIn,
      h("button", { class: "btn small", onclick: function () { setPin(c, (X.pinDraft[c.id] || "").trim()); } }, c.hasPin ? "Change" : "Set"),
      c.hasPin ? h("button", { class: "btn small", onclick: function () { setPin(c, ""); } }, "Remove") : null,

    if (a.join) {

  }

  function connectionsCard() {

    ni.addEventListener("keydown", function (e) { if (e.key === "Enter") newConnection(); });
    head.appendChild(h("div", { class: "row" }, ni, h("button", { class: "btn small primary", onclick: newConnection }, "New connection")));
    if (X.lastJoin) head.appendChild(h("div", { class: "notice info" }, "Connection created. Copy the player's link from its card below and send it to them."));
    var rc = requestsCard();
    if (rc) wrap.push(rc);
    wrap.push(head);
    var known = {};
    X.conns.forEach(function (c) { known[c.id] = 1; wrap.push(connectionCard(c, chars)); });
    // Connections this campaign remembers but the server hasn't listed yet (e.g. link off).
    Object.keys(X.assign).forEach(function (id) {
      if (!known[id] && !X.cfg.linkOn) wrap.push(connectionCard({ id: id, name: "(link off)", lastSeen: 0 }, chars));
    });
    if (!chars.length) wrap.push(h("div", { class: "notice" }, "No STA2e Character tokens found. Create or import characters in the STA 2E window, then press ⟳."));
    return wrap;
  }

  function activityCard() {
    var card = h("div", { class: "card" }, h("h3", null, "Activity"));
    if (!X.log.length) card.appendChild(h("div", { class: "muted small" }, "Nothing yet."));
    X.log.forEach(function (l) {
      card.appendChild(h("div", { class: "logline" }, h("span", { class: "muted small" }, new Date(l.at).toLocaleTimeString() + " "), l.text));
    });
    return card;
  }

  function render() {
    var app = document.getElementById("app");
    if (!app) return;
    // Never redraw under the GM's cursor while they type (a PIN, a name); catch up when they leave the field.
    var ae = document.activeElement;
    if (ae && app.contains(ae) && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA") && ae.type !== "checkbox") {
      if (!ae.dataset.rerender) { ae.dataset.rerender = "1"; ae.addEventListener("blur", function () { setTimeout(render, 0); }, { once: true }); }
      return;
    }
    var y = window.scrollY;
    app.innerHTML = "";
    app.appendChild(h("div", { class: "top" }, h("div", { class: "brand" }, "STA2e REMOTE"), h("span", { class: "spacer" }),
      h("button", { class: "iconbtn", title: "Reload characters", onclick: function () { A.loadAll().then(render); } }, "⟳")));
    var main = h("main");
    if (S.loading) main.appendChild(h("div", { class: "notice info" }, "Loading…"));
    else if (S.error) main.appendChild(h("div", { class: "notice bad" }, "Couldn't reach the STA 2E add-on: " + S.error + " Make sure it is installed.",
      h("div", null, h("button", { class: "btn small", onclick: start }, "Try again"))));
    else if (!S.ctx.isGM) main.appendChild(h("div", { class: "notice" }, "The remote link is run by the GM."));
    else {
      main.appendChild(serverCard());
      if (X.cfg.campaign) connectionsCard().forEach(function (c) { main.appendChild(c); });
      main.appendChild(activityCard());
    }
    if (!A.LIVE && root.MockBackend) main.appendChild(root.MockBackend.logView());
    app.appendChild(main);
    window.scrollTo(0, y);
  }
  A.render = render;
  A.renderRemote = render;

  function start() {
    S.loading = true; render();
    return Promise.all([A.loadAll(), loadConfig()]).then(function () {
      loadOpen(X.openRaw);
      render();
      if (X.cfg.linkOn && X.cfg.campaign) { X.status = "busy"; schedule(10); }
    }).catch(function (e) { S.loading = false; S.error = String(e && e.message || e); render(); });
  }
  // Keep "last seen" times fresh on screen.
  setInterval(function () {
    var ae = document.activeElement, tag = ae && ae.tagName;
    if (!inFlight && tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA") render();
  }, 5000);

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})(this);

</script>
</body>
</html>
